# Nova kostenlos bei Render (render.com) - Anleitung: cloud/ANLEITUNG.md
# Free: schlaeft nach 15 Min. ohne Besuch, wacht bei einem Besuch oder einer Telegram-Nachricht auf (~1 Min.),
# kein dauerhafter Speicher (Gedaechtnis beginnt nach dem Aufwachen neu).
services:
  - type: web
    name: nova
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /gesund
    envVars:
      - key: NOVA_TOKEN          # dein Schluessel fuer die Handy-App - Render erzeugt ihn
        generateValue: true
      - key: ANTHROPIC_API_KEY   # mindestens EIN KI-Schluessel (oder spaeter in der App eintragen)
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN  # aus der .env auf deinem PC (optional)
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NOVA_ABGLEICH_REPO      # Gedaechtnis-Abgleich mit deinem PC (/abgleich am PC zeigt die Schritte)
        sync: false
      - key: NOVA_ABGLEICH_TOKEN
        sync: false
      - key: NOVA_ABGLEICH_PASSWORT
        sync: false
      - key: ANRUF_NUMMER            # Anrufe: deine Handynummer (nur die ruft Nova an)
        sync: false
      - key: ANRUF_ANBIETER          # vonage oder bland
        sync: false
      - key: VONAGE_APP_ID
        sync: false
      - key: VONAGE_PRIVATE_KEY      # Inhalt der private.key (mehrzeilig oder Base64)
        sync: false
      - key: BLAND_API_KEY
        sync: false
