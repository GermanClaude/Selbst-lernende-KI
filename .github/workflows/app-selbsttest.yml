# Prueft die App auf einem echten Windows-Rechner: KI-App.exe bauen, starten und schauen,
# ob das Programmfenster erscheint und die Oberflaeche laedt (KI_SELBSTTEST=1 schliesst
# das Fenster danach selbst). Laeuft bei Aenderungen auf Arbeits-Branches und von Hand.
name: App-Selbsttest (Windows)

on:
  push:
    branches: ["claude/**"]
    paths:
      - "assistant/**"
      - "run_ki.py"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/app-selbsttest.yml"
  workflow_dispatch:

concurrency:
  group: app-selbsttest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selbsttest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9 pywebview==6.2.1 pythonnet==3.2.1 clr_loader==0.3.1 sounddevice SpeechRecognition pyttsx3 pyautogui pillow

      - name: Live-Sehen (Bildschirm, Texterkennung) dazu
        continue-on-error: true
        shell: bash
        run: |
          # Einzeln installieren: faellt ein Paket aus, fehlt nur dieser Teil - und es steht laut im Protokoll.
          fehlt=""
          for paket in numpy==2.5.4 comtypes==1.4.17 mss==10.2.0 dxcam==0.3.0 winrt-runtime==4.1.0 \
              "winrt-Windows.Foundation==4!10.0.28000.2957" "winrt-Windows.Foundation.Collections==4!10.0.28000.2957" \
              "winrt-Windows.Globalization==4!10.0.28000.2957" "winrt-Windows.Graphics.Imaging==4!10.0.28000.2957" \
              "winrt-Windows.Storage.Streams==4!10.0.28000.2957" "winrt-Windows.Media.Ocr==4!10.0.28000.2957"; do
            pip install "$paket" || { echo "::warning::Live-Sehen: $paket liess sich nicht installieren"; fehlt="$fehlt $paket"; }
          done
          python -c "import comtypes.client as c; c.GetModule('UIAutomationCore.dll'); print('UIA-Wrapper erzeugt')" \
            || echo "::warning::Live-Sehen: UIA-Huelle nicht erzeugt (Passwortschutz fehlt in der exe)"
          python -c "from assistant.sehen import fehlende_pakete as f; print('Live-Sehen fehlt:', f() or 'nichts')"
          if [ -n "$fehlt" ]; then echo "::warning::Live-Sehen unvollstaendig:$fehlt"; fi

      - name: Handy-Kamera (aiortc, PyAV, cryptography, segno) dazu
        continue-on-error: true
        shell: bash
        run: |
          fehlt=""
          for paket in "aiortc>=1.16,<1.17" "av>=14,<20" "cryptography>=44" "segno>=1.6"; do
            pip install "$paket" || { echo "::warning::Handy-Kamera: $paket liess sich nicht installieren"; fehlt="$fehlt $paket"; }
          done
          python -c "from assistant.kamera import fehlende_pakete as f; print('Handy-Kamera fehlt:', f() or 'nichts')"
          if [ -n "$fehlt" ]; then echo "::warning::Handy-Kamera unvollstaendig:$fehlt"; fi

      - name: Live-Mitschrift (vosk) dazu
        continue-on-error: true
        shell: bash
        run: pip install vosk || pip install --use-pep517 vosk

      - name: Versionen
        shell: bash
        run: |
          python --version
          pip show pywebview pythonnet clr_loader pyinstaller | grep -E "^(Name|Version)"

      - name: KI-App.exe bauen
        run: pyinstaller packaging/ki.spec --noconfirm

      - name: Groesse der exe
        shell: bash
        run: |
          ls -l dist/*.exe
          for f in dist/*.exe; do echo "### $(basename "$f"): $(( $(stat -c %s "$f") / 1048576 )) MB" >> "$GITHUB_STEP_SUMMARY"; done

      - name: KI-App.exe starten (auch umbenannt)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($name in @("KI-App.exe", "KI-App (1).exe")) {
            $dir = Join-Path $env:RUNNER_TEMP ("test-" + ($name -replace '[^A-Za-z0-9]', ''))
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item "dist/KI-App.exe" (Join-Path $dir $name)
            $env:KI_SELBSTTEST = "1"
            $started = Get-Date
            $p = Start-Process -FilePath (Join-Path $dir $name) -WorkingDirectory $dir -PassThru
            if (-not $p.WaitForExit(180000)) {
              Write-Host "ZEITUEBERSCHREITUNG - Prozess haengt"
              Stop-Process -Id $p.Id -Force
              $failed = $true
            }
            $secs = [int]((Get-Date) - $started).TotalSeconds
            Write-Host "=== $name : Exitcode $($p.ExitCode) nach $secs s"
            if ($p.ExitCode -ne 0) { $failed = $true }
            foreach ($f in @("logs/ki.log", "logs/absturz.log", "data/starts.json")) {
              $fp = Join-Path $dir $f
              if (Test-Path $fp) { Write-Host "--- $f"; Get-Content $fp -Tail 80 }
            }
          }
          if ($failed) { exit 1 }

      - name: Update ohne kaputte Verknuepfungen (Helfer) und Reparatur alter Verknuepfungen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $s = New-Object -ComObject WScript.Shell
          # 1) Update-Helfer: schreibt die neue Version IN dieselbe Datei (Datei-ID bleibt gleich)
          $dir = Join-Path $env:RUNNER_TEMP 'update-test'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $target = Join-Path $dir 'KI-App.exe'
          $neu = Join-Path $dir 'KI-App.exe.neu'
          Copy-Item dist/KI-App.exe $target
          Copy-Item dist/KI.exe $neu
          $lnkPath = Join-Path $dir 'Nova.lnk'
          $l = $s.CreateShortcut($lnkPath); $l.TargetPath = $target; $l.Save()
          $before = (fsutil file queryfileid $target)
          $helper = Join-Path $env:TEMP 'ki-update-selbsttest.exe'
          Copy-Item dist/KI-App.exe $helper
          $p = Start-Process -FilePath $helper -ArgumentList @('--update-einspielen', "`"$neu`"", "`"$target`"", '1', '--version') -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Update-Helfer haengt' }
          Start-Sleep -Seconds 5
          $after = (fsutil file queryfileid $target)
          $same = (Get-FileHash $target).Hash -eq (Get-FileHash dist/KI.exe).Hash
          Write-Host "Helfer-Exitcode $($p.ExitCode) | neuer Inhalt: $same"
          Write-Host "Datei-ID vorher: $before"
          Write-Host "Datei-ID nachher: $after"
          $log = Join-Path $dir 'logs/update.log'
          if (Test-Path $log) { Get-Content $log }
          if (-not $same) { throw 'Die neue Version wurde nicht eingespielt' }
          if ("$before" -ne "$after") { throw 'Datei-ID hat sich geaendert - Verknuepfungen wuerden wandern' }
          if (Test-Path $neu) { throw 'Die .neu-Datei wurde nicht aufgeraeumt' }
          if ($s.CreateShortcut($lnkPath).TargetPath -ne $target) { throw 'Verknuepfung zeigt woanders hin' }
          # 2) Reparatur: Verknuepfung, die (alte Updates) in den Sicherungsordner zeigt
          $root = Join-Path $env:RUNNER_TEMP 'reparatur-test'
          $old = Join-Path $root 'versionen\0.5.0_2026-11-08_010000'
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          Copy-Item dist/KI-App.exe (Join-Path $old 'KI-App.exe')
          $exe = Join-Path $root 'KI-App.exe'
          Copy-Item dist/KI-App.exe $exe
          $desk = [Environment]::GetFolderPath('Desktop')
          New-Item -ItemType Directory -Force -Path $desk | Out-Null
          $lnk = Join-Path $desk 'Nova-Selbsttest.lnk'
          $l = $s.CreateShortcut($lnk); $l.TargetPath = (Join-Path $old 'KI-App.exe'); $l.Save()
          python -c "import sys; from pathlib import Path; from assistant.austausch import repair_shortcuts; n = repair_shortcuts(Path(sys.argv[1]), Path(sys.argv[2])); print('repariert:', n); sys.exit(0 if n >= 1 else 1)" $exe $root
          $t = $s.CreateShortcut($lnk).TargetPath
          Remove-Item $lnk
          Write-Host "Verknuepfung zeigt jetzt auf: $t"
          if ($t -ne $exe) { throw "Verknuepfung wurde nicht repariert: $t" }
          # 3) Ausweichweg: die Datei ist gesperrt (das Programm laeuft noch) -> per Umbenennen einspielen
          $dir3 = Join-Path $env:RUNNER_TEMP 'update-gesperrt'
          New-Item -ItemType Directory -Force -Path $dir3 | Out-Null
          $t3 = Join-Path $dir3 'KI.exe'
          $neu3 = Join-Path $dir3 'KI.exe.neu'
          Copy-Item dist/KI.exe $t3
          Copy-Item dist/KI-App.exe $neu3
          $running = Start-Process -FilePath $t3 -WorkingDirectory $dir3 -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          # eigener Helfer: den aus Teil 1 hat die neu gestartete KI (richtig) schon aufgeraeumt
          $helper3 = Join-Path $env:TEMP 'ki-update-selbsttest3.exe'
          Copy-Item dist/KI-App.exe $helper3
          $p3 = Start-Process -FilePath $helper3 -ArgumentList @('--update-einspielen', "`"$neu3`"", "`"$t3`"", '1', '--version') -PassThru
          if (-not $p3.WaitForExit(180000)) { Stop-Process -Id $p3.Id -Force; throw 'Update-Helfer haengt (gesperrt)' }
          Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $log3 = Join-Path $dir3 'logs/update.log'
          if (Test-Path $log3) { Get-Content $log3 }
          Write-Host "Helfer-Exitcode (gesperrt): $($p3.ExitCode)"
          $ok3 = (Get-FileHash $t3).Hash -eq (Get-FileHash dist/KI-App.exe).Hash
          Write-Host "Gesperrte Datei: neue Version drin: $ok3 | .alt vorhanden: $(Test-Path "$t3.alt")"
          if (-not $ok3) { throw 'Der Ausweichweg (Umbenennen) hat nicht funktioniert' }
