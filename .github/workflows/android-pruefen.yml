# Prueft, ob die Handy-App sich bauen laesst - bei Aenderungen an android/ auf Neben-Branches (vor dem Release).
# Veroeffentlicht nichts.
name: Handy-App pruefen

on:
  push:
    branches-ignore: [ccr-cfa1ff8c-wgsyxb]
    paths: ["android/**", ".github/workflows/android-pruefen.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK bauen (Debug-Schluessel)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
