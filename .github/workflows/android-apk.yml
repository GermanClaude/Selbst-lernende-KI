# Baut die Handy-App (Nova-Handy.apk) und haengt sie an das Release der aktuellen Version.
# Laeuft, nachdem "KI.exe bauen und veroeffentlichen" fertig ist (dann gibt es das Release schon),
# oder von Hand (Actions > "Handy-App bauen" > Run workflow).
name: Handy-App bauen

on:
  workflow_run:
    workflows: ["KI.exe bauen und veroeffentlichen"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version bestimmen
        id: v
        run: |
          V=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('assistant/__init__.py', encoding='utf-8').read()).group(1))")
          IFS=. read -r a b c <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((a * 10000 + b * 100 + c))" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$V" > /dev/null 2>&1; then
            echo "::warning::Release v$V gibt es (noch) nicht - nichts zu tun."
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$V" --json assets -q '.assets[].name' | grep -qx 'Nova-Handy.apk' \
               && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Nova-Handy.apk ist schon im Release v$V."
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          else
            echo "bauen=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.v.outputs.bauen == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.bauen == 'true'
        with:
          gradle-version: "8.11.1"

      - name: Signierschluessel bereitlegen
        if: steps.v.outputs.bauen == 'true'
        env:
          KS: ${{ secrets.NOVA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/nova.keystore
            echo "Fester Signierschluessel: ja"
          else
            echo "::warning::Kein fester Signierschluessel (Secret NOVA_KEYSTORE_B64). Die APK wird mit einem Ersatz-Schluessel signiert - ein Update muss dann ueber Deinstallieren + neu Installieren laufen."
          fi

      - name: APK bauen
        if: steps.v.outputs.bauen == 'true'
        working-directory: android
        env:
          NOVA_VERSION: ${{ steps.v.outputs.version }}
          NOVA_VERSION_CODE: ${{ steps.v.outputs.code }}
          NOVA_KEYSTORE_PASS: ${{ secrets.NOVA_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Ans Release haengen
        if: steps.v.outputs.bauen == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Nova-Handy.apk
          ls -l Nova-Handy.apk
          gh release upload "v${{ steps.v.outputs.version }}" Nova-Handy.apk --clobber
          rm -f android/nova.keystore
