[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selbst-lernende-ki"
version = "0.1.0"
description = "Ein lokaler, lernfaehiger KI-Assistent (Jarvis-Stil) mit Gedaechtnis, Werkzeugen und PC-Zugriff unter deiner Kontrolle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.11.0",
    "openai>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "sounddevice>=0.4"]
pc = ["pyautogui>=0.9.54", "pillow>=10.0"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.4"]

[project.scripts]
ki = "assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
