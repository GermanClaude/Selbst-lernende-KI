[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selbst-lernende-ki"
version = "0.1.0"
description = "Ein lokaler, lernfaehiger KI-Assistent (Jarvis-Stil) mit Gedaechtnis, Werkzeugen und PC-Zugriff unter deiner Kontrolle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.11.0",
    "openai>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "sounddevice>=0.4"]
pc = ["pyautogui>=0.9.54"]
sehen = [
  "numpy>=2.0", "mss>=9.0", "pillow>=10",
  "dxcam==0.3.0 ; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "comtypes>=1.4 ; sys_platform == 'win32'",
  "winrt-runtime>=4.1 ; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr ; sys_platform == 'win32'",
  "winrt-Windows.Globalization ; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging ; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams ; sys_platform == 'win32'",
  "winrt-Windows.Foundation ; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections ; sys_platform == 'win32'",
]
handy = ["aiortc>=1.16,<1.17 ; python_version >= '3.11'", "av>=14,<20", "cryptography>=44", "segno>=1.6"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.4"]

[project.scripts]
ki = "assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
