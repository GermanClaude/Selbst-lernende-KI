# ============================================================================
#  Einstellungen fuer deine KI.
#  Kopiere diese Datei zu "config/settings.toml" und passe sie an.
#  (settings.toml wird NICHT in Git eingecheckt - es ist deine private Kopie.)
# ============================================================================

[provider]
# Welches "Gehirn" aktiv ist: "claude" (sehr stark), "deepseek" (extrem guenstig) oder
# "ollama" (kostenlos, laeuft auf deinem PC - ohne Schluessel).
aktiv = "claude"


# ----------------------------------------------------------------------------
#  CLAUDE (Anthropic) - Schluessel kommt aus .env: ANTHROPIC_API_KEY
# ----------------------------------------------------------------------------
[claude]
# Modell - am einfachsten in der App (Gehirn & Schluessel) oder mit /modell waehlen:
#   claude-opus-5-5    sehr stark und gruendlich (Standard)
#   claude-sonnet-5-5  schnell und stark - gut fuer jeden Tag
#   claude-haiku-5-5   blitzschnell und sehr guenstig - fuer einfache Sachen
#   claude-fable-5-1   das staerkste Claude - langsamer und teurer
model = "claude-opus-5-5"
# Denk-Tiefe (auch mit /denken): low = schnell | medium = ausgewogen | high = gruendlich |
# xhigh = sehr gruendlich | max = maximal. Mehr = bessere Antworten, aber laenger warten.
effort = "medium"
# Maximale Laenge EINER Antwort. Zu klein = grosse Dateien werden abgeschnitten.
max_tokens = 32000
server_side_fallback = false


# ----------------------------------------------------------------------------
#  DEEPSEEK - Schluessel kommt aus .env: DEEPSEEK_API_KEY
#  Sehr guenstig. Nutzt automatisches Kontext-Caching (verbilligt Wiederholungen).
# ----------------------------------------------------------------------------
[deepseek]
# Modell (auch mit /modell): "deepseek-flash" = schnell und extrem guenstig (Standard),
# "deepseek-v4-pro" = staerker bei schweren Aufgaben. Die alten Namen deepseek-chat und
# deepseek-reasoner hat DeepSeek abgeschaltet - sie werden automatisch umgestellt.
model = "deepseek-flash"
# Nachdenken vor der Antwort (auch mit /denken): aus = schnell | low = ausgewogen |
# high = gruendlich | max = maximal
denken = "aus"
base_url = "https://api.deepseek.com"
# Maximale Laenge EINER Antwort (mindestens 8192 empfohlen).
# Zu klein = grosse Dateien werden mitten im Schreiben abgeschnitten.
max_tokens = 8192
temperature = 0.6


# ----------------------------------------------------------------------------
#  OLLAMA - kostenlos, die Modelle laufen auf deinem PC (kein Schluessel, kein Internet).
#  Ollama installieren: https://ollama.com/download (oder: winget install Ollama.Ollama)
#  Modelle herunterladen: in der App unter "Gehirn & Schluessel" oder mit /ollama laden <modell>
# ----------------------------------------------------------------------------
[ollama]
# Adresse von Ollama (nur http/https). Ein OpenAI-kompatibler Server wie LM Studio geht auch:
# dann z.B. "http://localhost:1234/v1".
adresse = "http://localhost:11434"
# Modell (auch mit /modell ollama <name>): "qwen3.5:4b" (Standard, 3,4 GB, sieht Bilder),
# "qwen3.5:9b" (staerker, 6,6 GB, ab 16 GB RAM), "gemma4:e4b" (6,6 GB), "qwen3:4b" (2,5 GB).
# Jedes andere Ollama-Modell geht auch - am besten eins mit Werkzeugen ("tools").
model = "qwen3.5:4b"
# Nachdenken vor der Antwort: aus = schnell | an = gruendlich (nur Modelle, die das koennen)
denken = "aus"
# Wie viel sich das Modell auf einmal merken kann (Token). System-Prompt und Werkzeuge brauchen
# schon ~7000 - weniger als 16384 ist nicht sinnvoll. Mehr = mehr Arbeitsspeicher.
kontext = 16384
# Maximale Laenge EINER Antwort.
max_tokens = 8192


[ki]
# Anzeigename deiner KI.
name = "Nova"
# Wofuer die Buchstaben stehen - wird beim Start und in der App angezeigt.
bedeutung = "Neugierige, Offene, Vernetzte Assistenz"
language = "de"
# Laeuft die KI schon, oeffnet sich kein zweites Fenster.
nur_ein_fenster = true
# Zuletzt gewaehlter Charakter (/charakter) - die Persoenlichkeit steht in persona.md.
charakter = ""
# Womit start.bat die KI oeffnet: "terminal" (schwarzes Fenster) oder "app"
# (eigenes, schoeneres Fenster). start-app.bat oeffnet immer die App.
oberflaeche = "terminal"


# ----------------------------------------------------------------------------
#  STIL - wie die KI mit dir spricht (im Chat: /stil, in der App: "Charakter").
# ----------------------------------------------------------------------------
[stil]
anrede = "du"          # du | Sie
laenge = "normal"      # kurz | normal | ausfuehrlich
humor = "etwas"        # kein | etwas | viel
emojis = "aus"         # aus | an


# ----------------------------------------------------------------------------
#  SPARSAM - moeglichst wenig Token bei voller Leistung.
# ----------------------------------------------------------------------------
[sparsam]
aktiv = true
# Bittet die KI im System-Prompt, knapp und ohne Fuellsaetze zu antworten.
knapp_antworten = true
# Werkzeug-Ausgaben (z.B. Shell, Webseiten) auf so viele Zeichen kuerzen.
# Dateien lesen ist ausgenommen - das kommt ohnehin abschnittsweise.
max_werkzeug_ausgabe = 6000
# Verlauf nach so vielen Nachrichten von DIR zusammenfassen (Werkzeug-Schritte der
# KI zaehlen nicht mit). 0 = aus (dann gilt [conversation].compact_after_messages).
verlauf_kompakt_nach = 24


# ----------------------------------------------------------------------------
#  PREISE (US-Dollar pro 1 Mio. Token) - fuer die Kostenanzeige.
#  Bei Preisaenderung einfach die Zahlen anpassen. '/kosten' zeigt die Schaetzung.
# ----------------------------------------------------------------------------
[preise]
# US-Dollar pro 1 Mio. Token - nur fuer Modelle, die die KI nicht kennt (die bekannten
# Modelle bringen ihre Preise selbst mit, siehe assistant/modelle.py).
claude_input = 4.0
claude_cache_hit = 0.2
claude_output = 20.0
deepseek_input = 0.15
deepseek_cache_hit = 0.003
deepseek_output = 0.6
usd_zu_eur = 0.92


# ----------------------------------------------------------------------------
#  AFK-MODUS - "Ich bin weg": die KI arbeitet allein weiter (/afk oder Knopf in der App).
#  Sie loescht, ueberschreibt, verschickt und startet dabei nichts - das schlaegt sie nur vor.
# ----------------------------------------------------------------------------
[afk]
max_minuten = 120      # hoechstens so lange
max_euro = 1.0         # hoechstens so viel Kosten (ca.)
max_schritte = 12      # hoechstens so viele Arbeitsschritte
pause_sekunden = 20    # Pause zwischen zwei Schritten
max_werkzeug_schritte = 25  # Werkzeug-Schritte innerhalb eines Arbeitsschritts


[bilder]
# Bildgenerator: "auto" = Cloudflare, wenn Schluessel da (CLOUDFLARE_AI_API_KEY und
# CLOUDFLARE_ACCOUNT_ID in der .env), sonst AI Horde (kostenlos, ohne Anmeldung, mit Wartezeit).
anbieter = "auto"
max_bilder_pro_nachricht = 10
max_kantenlaenge = 1568   # hochgeladene Bilder werden auf diese Groesse verkleinert (spart Kosten)


[feedback]
nachfragen = true               # nach ca. einer Stunde und dann alle paar Tage freundlich nachfragen
erste_nachfrage_minuten = 60
nachfrage_alle_tage = 12


[memory]
db_path = "data/memory.sqlite3"
max_facts_in_context = 60


[conversation]
# Nach so vielen Nachrichten von DIR wird der Verlauf zusammengefasst
# (gilt, wenn der Sparmodus aus ist).
compact_after_messages = 40
# Zusaetzlich zusammenfassen, wenn der Verlauf groesser als so viele Zeichen wird
# (~4 Zeichen = 1 Token). 0 = aus.
max_verlauf_zeichen = 400000
# So viele Werkzeug-Schritte (Datei lesen, schreiben, ...) darf die KI pro Nachricht
# machen. Danach haelt sie an und du schreibst "weiter".
max_werkzeug_runden = 60
# Am Schritt-Limit so oft von selbst weiterarbeiten, bevor sie fragt (0 = immer
# fragen). Strg+C haelt jederzeit an.
automatisch_weiter = 3
# So viele Werkzeug-Schritte darf ein Agent (Recherche/Helfer/Pruefer) machen.
agent_runden = 40


[voice]
# Sprechtaste F2: gedrueckt HALTEN und sprechen (loslassen = fertig) - oder kurz
# druecken = Mikrofon an, nochmal F2 = fertig. Der Text landet in der Eingabezeile.
# Einrichten im Chat mit:  /sprache einrichten
f2_aufnahme = true
# true = das Gesprochene nach dem Loslassen gleich abschicken (ohne Enter)
sofort_senden = false
# Spracherkennung: "auto" (Whisper, falls installiert, sonst Google),
# "google" (online, kostenlos) oder "whisper" (offline: pip install faster-whisper).
erkennung = "auto"
# Whisper-Modell: tiny | base | small | medium (groesser = genauer, langsamer)
whisper_modell = "small"
sprache = "de"
# Live-Sprachmodus (Jarvis, /jarvis): Nova schreibt mit, WAEHREND du sprichst
# (Vosk, offline - das deutsche Modell, ~45 MB, kommt mit /sprache einrichten).
live_mitschrift = true
# So viele Sekunden Sprechpause, dann antwortet sie (kleiner = schneller).
pause = 0.6
# Dazwischenreden stoppt Nova sofort (mit Kopfhoerer am zuverlaessigsten).
unterbrechen = true
# true = den Satz zusaetzlich mit Google/Whisper pruefen (genauer, ~1 s langsamer)
live_genau = false
# Wie tief Claude im Sprachmodus nachdenkt: "low" = schnelle Antworten, "" = wie im Chat
live_denktiefe = "low"
# Antworten vorlesen (pip install pyttsx3) - im Chat: /sprache vorlesen
speak_responses = false
# Alter Dauer-Sprachmodus (braucht PyAudio) - meist reicht F2.
enabled = false
wake_word = ""


# ----------------------------------------------------------------------------
#  UPDATES - neue Versionen kommen automatisch aus dem GitHub-Repo.
# ----------------------------------------------------------------------------
[update]
# "automatisch" = selbst installieren (die alte Version wird gesichert),
# "fragen" = vorher fragen, "aus" = nie nachschauen.
modus = "automatisch"
repo = "GermanClaude/Selbst-lernende-KI"
# Leer = Standard-Branch des Repos (dort landen fertige Versionen).
branch = ""
pruefen_alle_stunden = 24
# So viele alte Versionen bleiben im Ordner "versionen" (/versionen, /zurueck).
alte_versionen_behalten = 5


# ----------------------------------------------------------------------------
#  SICHERHEIT - bitte bewusst einstellen.
# ----------------------------------------------------------------------------
[permissions]
# SAFE MODE: true sperrt gefaehrliche Aktionen (Loeschen, Shell, PC-Steuerung).
safe_mode = true
# false = KI fragt vor jeder schreibenden/gefaehrlichen Aktion nach.
# Im Chat: bei einer Rueckfrage 'a' (= ab jetzt immer) oder /erlauben alles.
auto_confirm = false
# Auch bei auto_confirm = true vorher fragen, bevor die KI einen automatischen
# Start einrichtet (Aufgabenplanung/Autostart) oder sich selbst neu startet.
autostart_immer_fragen = true
# Arbeitsordner ("Sandbox"). Leer = Ordner "workspace" im Projekt.
workspace_root = ""
# true = Zugriff auch ausserhalb des Arbeitsordners (volles Dateisystem).
allow_full_filesystem = false
# Geloeschtes wandert erst in die Quarantaene (wiederherstellbar).
use_quarantine = true
shell_allowlist = ["echo", "ls", "dir", "pwd", "cat", "type", "whoami", "date"]
shell_denylist = ["rm -rf /", "mkfs", "format c:", ":(){", "dd if=", "shutdown"]
