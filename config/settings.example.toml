# ============================================================================
#  Einstellungen fuer deine KI.
#  Kopiere diese Datei zu "config/settings.toml" und passe sie an.
#  (settings.toml wird NICHT in Git eingecheckt - es ist deine private Kopie.)
# ============================================================================

[provider]
# Welches "Gehirn" aktiv ist: "claude" (sehr stark) oder "deepseek" (extrem guenstig).
aktiv = "claude"


# ----------------------------------------------------------------------------
#  CLAUDE (Anthropic) - Schluessel kommt aus .env: ANTHROPIC_API_KEY
# ----------------------------------------------------------------------------
[claude]
model = "claude-opus-5-5"
# Denk-Tiefe: low | medium | high | xhigh | max  (mehr = gruendlicher, teurer)
effort = "high"
# Maximale Laenge EINER Antwort. Zu klein = grosse Dateien werden abgeschnitten.
max_tokens = 32000
server_side_fallback = false


# ----------------------------------------------------------------------------
#  DEEPSEEK - Schluessel kommt aus .env: DEEPSEEK_API_KEY
#  Sehr guenstig. Nutzt automatisches Kontext-Caching (verbilligt Wiederholungen).
# ----------------------------------------------------------------------------
[deepseek]
# Modell-ID. "deepseek-chat" ist der guenstige, schnelle Standard (Nicht-Denker).
# Falls dein Konto diesen Alias nicht kennt, probiere "deepseek-flash" oder
# "deepseek-v4-pro". Fuer schwierige Logik gibt es "deepseek-reasoner" (mehr Token).
model = "deepseek-chat"
base_url = "https://api.deepseek.com"
# Maximale Laenge EINER Antwort (mindestens 8192 empfohlen).
# Zu klein = grosse Dateien werden mitten im Schreiben abgeschnitten.
max_tokens = 8192
temperature = 0.6


[ki]
# Anzeigename deiner KI.
name = "Aria"
language = "de"
# Laeuft die KI schon, oeffnet sich kein zweites Fenster.
nur_ein_fenster = true
# Womit start.bat die KI oeffnet: "terminal" (schwarzes Fenster) oder "app"
# (eigenes, schoeneres Fenster). start-app.bat oeffnet immer die App.
oberflaeche = "terminal"


# ----------------------------------------------------------------------------
#  SPARSAM - moeglichst wenig Token bei voller Leistung.
# ----------------------------------------------------------------------------
[sparsam]
aktiv = true
# Bittet die KI im System-Prompt, knapp und ohne Fuellsaetze zu antworten.
knapp_antworten = true
# Werkzeug-Ausgaben (z.B. Shell, Webseiten) auf so viele Zeichen kuerzen.
# Dateien lesen ist ausgenommen - das kommt ohnehin abschnittsweise.
max_werkzeug_ausgabe = 6000
# Verlauf nach so vielen Nachrichten von DIR zusammenfassen (Werkzeug-Schritte der
# KI zaehlen nicht mit). 0 = aus (dann gilt [conversation].compact_after_messages).
verlauf_kompakt_nach = 24


# ----------------------------------------------------------------------------
#  PREISE (US-Dollar pro 1 Mio. Token) - fuer die Kostenanzeige.
#  Bei Preisaenderung einfach die Zahlen anpassen. '/kosten' zeigt die Schaetzung.
# ----------------------------------------------------------------------------
[preise]
claude_input = 4.0
claude_cache_hit = 0.2
claude_output = 20.0
deepseek_input = 0.28
deepseek_cache_hit = 0.028
deepseek_output = 0.42
usd_zu_eur = 0.92


[memory]
db_path = "data/memory.sqlite3"
max_facts_in_context = 60


[conversation]
# Nach so vielen Nachrichten von DIR wird der Verlauf zusammengefasst
# (gilt, wenn der Sparmodus aus ist).
compact_after_messages = 40
# Zusaetzlich zusammenfassen, wenn der Verlauf groesser als so viele Zeichen wird
# (~4 Zeichen = 1 Token). 0 = aus.
max_verlauf_zeichen = 400000
# So viele Werkzeug-Schritte (Datei lesen, schreiben, ...) darf die KI pro Nachricht
# machen. Danach haelt sie an und du schreibst "weiter".
max_werkzeug_runden = 60
# Am Schritt-Limit so oft von selbst weiterarbeiten, bevor sie fragt (0 = immer
# fragen). Strg+C haelt jederzeit an.
automatisch_weiter = 3
# So viele Werkzeug-Schritte darf ein Agent (Recherche/Helfer/Pruefer) machen.
agent_runden = 40


[voice]
# Sprechtaste F2: gedrueckt HALTEN und sprechen (loslassen = fertig) - oder kurz
# druecken = Mikrofon an, nochmal F2 = fertig. Der Text landet in der Eingabezeile.
# Einrichten im Chat mit:  /sprache einrichten
f2_aufnahme = true
# Spracherkennung: "auto" (Whisper, falls installiert, sonst Google),
# "google" (online, kostenlos) oder "whisper" (offline: pip install faster-whisper).
erkennung = "auto"
# Whisper-Modell: tiny | base | small | medium (groesser = genauer, langsamer)
whisper_modell = "small"
sprache = "de"
# Antworten vorlesen (pip install pyttsx3) - im Chat: /sprache vorlesen
speak_responses = false
# Alter Dauer-Sprachmodus (braucht PyAudio) - meist reicht F2.
enabled = false
wake_word = ""


# ----------------------------------------------------------------------------
#  UPDATES - neue Versionen kommen automatisch aus dem GitHub-Repo.
# ----------------------------------------------------------------------------
[update]
# "automatisch" = selbst installieren (die alte Version wird gesichert),
# "fragen" = vorher fragen, "aus" = nie nachschauen.
modus = "automatisch"
repo = "GermanClaude/Selbst-lernende-KI"
# Leer = Standard-Branch des Repos (dort landen fertige Versionen).
branch = ""
pruefen_alle_stunden = 24
# So viele alte Versionen bleiben im Ordner "versionen" (/versionen, /zurueck).
alte_versionen_behalten = 5


# ----------------------------------------------------------------------------
#  SICHERHEIT - bitte bewusst einstellen.
# ----------------------------------------------------------------------------
[permissions]
# SAFE MODE: true sperrt gefaehrliche Aktionen (Loeschen, Shell, PC-Steuerung).
safe_mode = true
# false = KI fragt vor jeder schreibenden/gefaehrlichen Aktion nach.
# Im Chat: bei einer Rueckfrage 'a' (= ab jetzt immer) oder /erlauben alles.
auto_confirm = false
# Auch bei auto_confirm = true vorher fragen, bevor die KI einen automatischen
# Start einrichtet (Aufgabenplanung/Autostart) oder sich selbst neu startet.
autostart_immer_fragen = true
# Arbeitsordner ("Sandbox"). Leer = Ordner "workspace" im Projekt.
workspace_root = ""
# true = Zugriff auch ausserhalb des Arbeitsordners (volles Dateisystem).
allow_full_filesystem = false
# Geloeschtes wandert erst in die Quarantaene (wiederherstellbar).
use_quarantine = true
shell_allowlist = ["echo", "ls", "dir", "pwd", "cat", "type", "whoami", "date"]
shell_denylist = ["rm -rf /", "mkfs", "format c:", ":(){", "dd if=", "shutdown"]
